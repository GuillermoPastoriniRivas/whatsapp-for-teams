upstream asis_api { server asis-api:3000; }

server {
    listen 80;
    server_name asis.chat www.asis.chat media.asis.chat;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name asis.chat www.asis.chat;
    ssl_certificate /etc/letsencrypt/live/asis.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asis.chat/privkey.pem;

    root /usr/share/nginx/html/asis;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location ^~ /api/ { proxy_pass http://asis_api; include /etc/nginx/proxy_params; }
    location ^~ /webhook { proxy_pass http://asis_api; include /etc/nginx/proxy_params; }
    location ^~ /socket.io/ {
        proxy_pass http://asis_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/conversations/.+ { try_files $uri $uri.html /conversations/__dynamic__.html; }
    location ~ ^/campaigns/.+ { try_files $uri $uri.html /campaigns/__dynamic__.html; }
    location ~ ^/flows/.+ { try_files $uri $uri.html /flows/__dynamic__.html; }
    location ~ ^/(.+)/$ { try_files /$1.html /index.html; }

    location / { try_files $uri $uri.html /index.html; }
}

server {
    listen 443 ssl;
    server_name media.asis.chat;
    ssl_certificate /etc/letsencrypt/live/media.asis.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.asis.chat/privkey.pem;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location ^~ /api/media/ {
        proxy_pass http://asis_api;
        proxy_read_timeout 120s;
        include /etc/nginx/proxy_params;
    }
    location / { return 404; }
}
