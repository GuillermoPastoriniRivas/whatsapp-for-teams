upstream api {
    server api:3000;
}

upstream ui {
    server ui:3001;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name asis.chat www.asis.chat;
    return 301 https://$host$request_uri;
}

# Fallback for IP-based access (no redirect)
server {
    listen 80 default_server;
    server_name _;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Adjuntos: WhatsApp acepta documentos de hasta 100 MB. Sin esto nginx
        # corta en 1 MB y el upload muere con 413 antes de llegar a la API.
        client_max_body_size 101m;
        proxy_request_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /webhook {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name asis.chat www.asis.chat;

    ssl_certificate     /etc/letsencrypt/live/asis.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asis.chat/privkey.pem;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Adjuntos: WhatsApp acepta documentos de hasta 100 MB. Sin esto nginx
        # corta en 1 MB y el upload muere con 413 antes de llegar a la API.
        client_max_body_size 101m;
        proxy_request_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /webhook {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─────────────────────────────────────────────────
# api.asis.chat — la API, con su propio nombre
#
# No reemplaza a asis.chat/api: los dos bloques conviven y las dos URLs siguen
# funcionando igual. Este existe para poder darle a un tercero (Meta, n8n, un
# cliente MCP) un host que no sea el de la app.
#
# Las rutas son las mismas que en asis.chat, prefijo `/api` incluido, así que
# https://api.asis.chat/api/mcp y https://asis.chat/api/mcp son el mismo lugar.
# No se sirve la UI acá.
#
# Requiere el cert de api.asis.chat. Si no existe, nginx NO ARRANCA y se cae el
# sitio entero: emitirlo ANTES de deployar este bloque.
# ─────────────────────────────────────────────────
server {
    listen 80;
    server_name api.asis.chat;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.asis.chat;

    ssl_certificate     /etc/letsencrypt/live/api.asis.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.asis.chat/privkey.pem;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        client_max_body_size 101m;
        proxy_request_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # La app no vive en este dominio.
    location / {
        return 404;
    }
}

# ─────────────────────────────────────────────────
# media.asis.chat — contenido subido por terceros
#
# Dominio aparte a propósito: lo que sube un cliente nunca comparte origen con
# la app, así que no puede tocar su sesión. Solo expone /api/media/ — nada de
# la API, ni el socket, ni la UI.
#
# Requiere el cert de media.asis.chat. Si no existe, nginx NO ARRANCA y se cae
# el sitio entero: emitirlo ANTES de deployar este bloque.
# ─────────────────────────────────────────────────
server {
    listen 80;
    server_name media.asis.chat;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name media.asis.chat;

    ssl_certificate     /etc/letsencrypt/live/media.asis.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.asis.chat/privkey.pem;

    # Los archivos pueden ser de hasta 100 MB (el tope de documentos de WhatsApp).
    client_max_body_size 101m;

    location /api/media/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # En passthrough cada request baja el archivo de Meta: puede tardar.
        proxy_read_timeout 120s;
    }

    # Cualquier otra ruta en este dominio no existe.
    location / {
        return 404;
    }
}
