upstream quiero_menu_api { server quiero-menu-api:3000; }

server {
    listen 80;
    server_name quiero.menu www.quiero.menu;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name quiero.menu www.quiero.menu;
    ssl_certificate /etc/letsencrypt/live/quiero.menu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiero.menu/privkey.pem;

    root /usr/share/nginx/html/quiero-menu;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location ^~ /api/ { proxy_pass http://quiero_menu_api; include /etc/nginx/proxy_params; }
    location ^~ /socket.io/ {
        proxy_pass http://quiero_menu_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/delivery/.+ { try_files $uri $uri.html /delivery/__dynamic__.html; }
    location ~ ^/kitchen/.+ { try_files $uri $uri.html /kitchen/__dynamic__.html; }
    location ~ ^/(.+)/$ { try_files /$1.html /__dynamic__.html; }
    location ~ ^/[^./]+$ { try_files $uri $uri.html /__dynamic__.html; }

    location / { try_files $uri $uri.html /index.html; }
}
