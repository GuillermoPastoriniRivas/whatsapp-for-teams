upstream fluws_api { server fluws-api:3301; }

server {
    listen 80;
    server_name fluws.com www.fluws.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://fluws.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.fluws.com;
    ssl_certificate /etc/letsencrypt/live/fluws.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fluws.com/privkey.pem;
    return 301 https://fluws.com$request_uri;
}

server {
    listen 443 ssl;
    server_name fluws.com;
    ssl_certificate /etc/letsencrypt/live/fluws.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fluws.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    root /usr/share/nginx/html/fluws;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location ^~ /mcp {
        proxy_pass http://fluws_api;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location ^~ /hook/ { proxy_pass http://fluws_api; include /etc/nginx/proxy_params; proxy_read_timeout 60s; }
    location ^~ /agent/ { proxy_pass http://fluws_api; include /etc/nginx/proxy_params; proxy_read_timeout 30s; }
    location ^~ /auth/ { proxy_pass http://fluws_api; include /etc/nginx/proxy_params; }
    location ^~ /workspaces { proxy_pass http://fluws_api; include /etc/nginx/proxy_params; proxy_read_timeout 120s; }
    location ^~ /docs/ { proxy_pass http://fluws_api; include /etc/nginx/proxy_params; }
    location ^~ /sync { proxy_pass http://fluws_api; include /etc/nginx/proxy_params; proxy_read_timeout 120s; }
    location ^~ /revisions { proxy_pass http://fluws_api; include /etc/nginx/proxy_params; }
    location ^~ /api-keys { proxy_pass http://fluws_api; include /etc/nginx/proxy_params; }
    location ^~ /health { proxy_pass http://fluws_api; include /etc/nginx/proxy_params; access_log off; }

    location = /docs { try_files /docs.html =404; }

    location ~ ^/doc/.+ { try_files $uri $uri.html /doc/placeholder.html; }
    location ~ ^/edit/.+ { try_files $uri $uri.html /edit/placeholder.html; }
    location ~ ^/history/.+ { try_files $uri $uri.html /history/placeholder.html; }
    location ~ ^/(.+)/$ { try_files /$1.html /404.html; }

    location / { try_files $uri $uri.html /404.html; }
}
