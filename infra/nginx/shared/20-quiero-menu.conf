upstream quiero_menu_api { server quiero-menu-api:3000; }
upstream quiero_menu_ui { server quiero-menu-ui:3002; }

server {
    listen 80;
    server_name quiero.menu www.quiero.menu;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Redirect HTTPS www -> root to keep a single canonical domain
server {
    listen 443 ssl;
    server_name www.quiero.menu;
    ssl_certificate /etc/letsencrypt/live/quiero.menu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiero.menu/privkey.pem;
    return 301 https://quiero.menu$request_uri;
}

server {
    listen 443 ssl;
    server_name quiero.menu www.quiero.menu;
    ssl_certificate /etc/letsencrypt/live/quiero.menu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiero.menu/privkey.pem;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location ^~ /api/ { proxy_pass http://quiero_menu_api; include /etc/nginx/proxy_params; }
    location ^~ /socket.io/ {
        proxy_pass http://quiero_menu_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demás (HTML, /_next, sw.js, manifest, storefronts) lo sirve el
    # server de Next (SSR). El HTML dinámico sale con no-cache por defecto.
    location / {
        proxy_pass http://quiero_menu_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}