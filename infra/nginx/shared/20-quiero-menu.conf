upstream quiero_menu_api { server quiero-menu-api:3000; }

server {
    listen 80;
    server_name quiero.menu www.quiero.menu;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name quiero.menu www.quiero.menu;
    ssl_certificate /etc/letsencrypt/live/quiero.menu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiero.menu/privkey.pem;

    root /usr/share/nginx/html/quiero-menu;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location ^~ /api/ { proxy_pass http://quiero_menu_api; include /etc/nginx/proxy_params; }
    location ^~ /socket.io/ {
        proxy_pass http://quiero_menu_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed assets: real 404 when a deploy removes an old chunk. Without this,
    # missing JS falls back to index.html (200 text/html) and the browser throws
    # "Unexpected token '<'" -> app never boots (infinite loading).
    location ^~ /_next/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML shell must always revalidate so clients never keep pointing at
    # chunks that no longer exist after a deploy. The regex locations below
    # serve the per-page .html files of the static export directly (no internal
    # redirect to __dynamic__.html), so each needs the no-cache header too.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /__dynamic__.html { add_header Cache-Control "no-cache"; }
    location = /tracking/__dynamic__.html { add_header Cache-Control "no-cache"; }
    location = /kitchen/__dynamic__.html { add_header Cache-Control "no-cache"; }
    location = /delivery/__dynamic__.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }

    location ~ ^/tracking/.+ { try_files $uri $uri.html /tracking/__dynamic__.html; add_header Cache-Control "no-cache"; }
    location ~ ^/delivery/.+ { try_files $uri $uri.html /delivery/__dynamic__.html; add_header Cache-Control "no-cache"; }
    location ~ ^/kitchen/.+ { try_files $uri $uri.html /kitchen/__dynamic__.html; add_header Cache-Control "no-cache"; }
    location ~ ^/(.+)/$ { try_files /$1.html /__dynamic__.html; add_header Cache-Control "no-cache"; }
    location ~ ^/[^./]+$ { try_files $uri $uri.html /__dynamic__.html; add_header Cache-Control "no-cache"; }

    location / { try_files $uri $uri.html /index.html; add_header Cache-Control "no-cache"; }
}