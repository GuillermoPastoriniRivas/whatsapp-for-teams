name: Deploy turnos to shared host

on:
  push:
    branches: [main]
    paths:
      - "turnos/**"
      - "docker-compose.shared.yml"
      - "infra/nginx/shared/40-turnos.conf"
      - "infra/nginx/proxy_params"
      - "infra/scripts/hydrate-env.sh"
      - ".github/workflows/deploy-turnos.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  APP_DIR: /home/ubuntu/shared

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build ARM64 API image
        run: docker buildx build --platform linux/arm64 --load -t shared-turnos-api:latest ./turnos/api

      - name: Build static UI
        working-directory: turnos/ui
        env:
          VITE_API_BASE_URL: https://turnos.fluws.com/api
          VITE_PUBLIC_BASE_URL: https://turnos.fluws.com
        run: |
          npm ci
          npm run build
          tar -czf ../../turnos-static.tar.gz -C dist .

      - name: Save API image
        run: docker save shared-turnos-api:latest | gzip > shared-turnos-api.tar.gz

      - name: Copy artifacts and nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SHARED_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SHARED_EC2_SSH_KEY }}
          source: "shared-turnos-api.tar.gz,turnos-static.tar.gz,docker-compose.shared.yml,infra/nginx/shared/,turnos/deploy/turnos-acme.conf,infra/nginx/proxy_params,infra/scripts/hydrate-env.sh"
          target: ${{ env.APP_DIR }}

      - name: Activate turnos
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SHARED_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SHARED_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ env.APP_DIR }}
            mkdir -p static/turnos turnos/api nginx-enabled certbot

            docker load < shared-turnos-api.tar.gz
            chmod +x infra/scripts/hydrate-env.sh
            bash infra/scripts/hydrate-env.sh /turnos/api ./turnos/api/.env
            test -s ./turnos/api/.env

            rm -rf static/turnos
            mkdir -p static/turnos
            tar -xzf turnos-static.tar.gz -C static/turnos

            # Bootstrap acme sin SSL para no tirar nginx si falta el cert
            cp turnos/deploy/turnos-acme.conf nginx-enabled/40-turnos.conf
            cp docker-compose.shared.yml docker-compose.yml
            cp infra/nginx/shared/00-common.conf nginx-enabled/ 2>/dev/null || true
            docker compose -f docker-compose.yml up -d --no-deps nginx turnos-api
            docker exec shared-nginx nginx -t
            docker exec shared-nginx nginx -s reload

            if ! sudo test -f /etc/letsencrypt/live/turnos.fluws.com/fullchain.pem; then
              sudo certbot certonly --webroot -w "$PWD/certbot" --non-interactive --agree-tos \
                -m "${{ secrets.TLS_EMAIL }}" --keep-until-expiring -d turnos.fluws.com
            fi

            cp infra/nginx/shared/40-turnos.conf nginx-enabled/40-turnos.conf
            docker exec shared-nginx nginx -t
            docker exec shared-nginx nginx -s reload

            rm -f shared-turnos-api.tar.gz turnos-static.tar.gz
            docker image prune -f

      - name: Verify turnos
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://turnos.fluws.com/ || true)
            [ "$code" = "200" ] && echo "turnos.fluws.com OK ($code)" && exit 0
            sleep 6
          done
          echo "turnos.fluws.com no respondió 200 (último: ${code:-sin respuesta})"
          exit 1
