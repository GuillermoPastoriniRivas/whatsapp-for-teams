map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream asis_api { server asis-api:3000; }
upstream quiero_menu_api { server quiero-menu-api:3000; }
upstream fluws_api { server fluws-api:3301; }

client_max_body_size 101m;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name asis.chat www.asis.chat media.asis.chat fluws.com www.fluws.com quiero.menu www.quiero.menu;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name asis.chat www.asis.chat;
    ssl_certificate /etc/letsencrypt/live/asis.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asis.chat/privkey.pem;

    root /usr/share/nginx/html/asis;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /api/ { proxy_pass http://asis_api; include /etc/nginx/proxy_params; }
    location /socket.io/ {
        proxy_pass http://asis_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /webhook { proxy_pass http://asis_api; include /etc/nginx/proxy_params; }
    location ~ ^/conversations/.+ { try_files $uri $uri/ /conversations/__dynamic__/index.html; }
    location ~ ^/campaigns/.+ { try_files $uri $uri/ /campaigns/__dynamic__/index.html; }
    location ~ ^/flows/.+ { try_files $uri $uri/ /flows/__dynamic__/index.html; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl;
    server_name media.asis.chat;
    ssl_certificate /etc/letsencrypt/live/media.asis.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.asis.chat/privkey.pem;
    client_max_body_size 101m;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /api/media/ {
        proxy_pass http://asis_api;
        proxy_read_timeout 120s;
        include /etc/nginx/proxy_params;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name quiero.menu www.quiero.menu;
    ssl_certificate /etc/letsencrypt/live/quiero.menu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiero.menu/privkey.pem;

    root /usr/share/nginx/html/quiero-menu;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /api/ { proxy_pass http://quiero_menu_api; include /etc/nginx/proxy_params; }
    location /socket.io/ {
        proxy_pass http://quiero_menu_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/delivery/.+ { try_files $uri $uri/ /delivery/__dynamic__/index.html; }
    location ~ ^/kitchen/.+ { try_files $uri $uri/ /kitchen/__dynamic__/index.html; }
    location ~ ^/[^./]+$ { try_files $uri $uri/ /__dynamic__/index.html; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl;
    server_name fluws.com;
    ssl_certificate /etc/letsencrypt/live/fluws.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fluws.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    root /usr/share/nginx/html/fluws;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /mcp { proxy_pass http://fluws_api; include /etc/nginx/proxy_params; proxy_read_timeout 120s; proxy_buffering off; }
    location /hook/ { proxy_pass http://fluws_api; include /etc/nginx/proxy_params; }
    location /agent/ { proxy_pass http://fluws_api; include /etc/nginx/proxy_params; }
    location /health { proxy_pass http://fluws_api; include /etc/nginx/proxy_params; access_log off; }
    location ~ ^/doc/.+ { try_files $uri $uri/ /doc/placeholder/index.html; }
    location ~ ^/edit/.+ { try_files $uri $uri/ /edit/placeholder/index.html; }
    location ~ ^/history/.+ { try_files $uri $uri/ /history/placeholder/index.html; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl;
    server_name www.fluws.com;
    ssl_certificate /etc/letsencrypt/live/fluws.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fluws.com/privkey.pem;
    return 301 https://fluws.com$request_uri;
}
